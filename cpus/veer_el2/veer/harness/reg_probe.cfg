# Adapted for CPU-Eval from VeeR EL2's .github/scripts/openocd/sim-jtagdpi.cfg
# and veer-el2-rst.cfg at aefefae20b77fa61ba306bff36a72f42ae4cc028.
# The combined configuration uses normal OpenOCD target examination.

adapter driver remote_bitbang
remote_bitbang port 5000
remote_bitbang host localhost

if { [info exists CHIPNAME] } {
   set  _CHIPNAME $CHIPNAME
} else {
   set  _CHIPNAME riscv
}
jtag newtap $_CHIPNAME tap -irlen 5
set _TARGETNAME $_CHIPNAME.tap
target create $_TARGETNAME.0 riscv -chain-position $_TARGETNAME -rtos hwthread
$_TARGETNAME.0 configure -work-area-phys 0x50001000 -work-area-size 0x1000 -work-area-backup 0

gdb_report_data_abort enable
gdb_report_register_access_error enable
gdb_breakpoint_override hard
riscv set_command_timeout_sec 20
