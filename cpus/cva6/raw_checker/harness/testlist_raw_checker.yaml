common_test_config: &common_test_config
  path_var: TESTS_PATH
  gcc_opts: "-DXLEN=32 -DTEST_CASE_1=True -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<path_var>/riscv-arch-test/riscv-test-suite/env/ -I<path_var>/riscv-arch-test/riscv-target/spike/"

testlist:
  - {test: rv32im-raw-checker-wrap, <<: *common_test_config, iterations: 1, asm_tests: <path_var>/cpu-eval-patches/raw_checker_wrap.S}
  - {test: rv32im-add-01, <<: *common_test_config, iterations: 1, asm_tests: <path_var>/riscv-arch-test/riscv-test-suite/rv32i_m/I/src/add-01.S}
  - {test: rv32im-sll-01, <<: *common_test_config, iterations: 1, asm_tests: <path_var>/riscv-arch-test/riscv-test-suite/rv32i_m/I/src/sll-01.S}
  - {test: rv32im-beq-01, <<: *common_test_config, iterations: 1, asm_tests: <path_var>/riscv-arch-test/riscv-test-suite/rv32i_m/I/src/beq-01.S}
  - {test: rv32im-lw-align-01, <<: *common_test_config, iterations: 1, asm_tests: <path_var>/riscv-arch-test/riscv-test-suite/rv32i_m/I/src/lw-align-01.S}
