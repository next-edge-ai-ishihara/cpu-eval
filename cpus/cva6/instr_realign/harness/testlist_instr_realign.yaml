common_test_config: &common_test_config
  path_var: TESTS_PATH
  iterations: 1
  gcc_opts: "-DXLEN=32 -DTEST_CASE_1=True -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<path_var>/riscv-arch-test/riscv-test-suite/env/ -I<path_var>/riscv-arch-test/riscv-target/spike/"

testlist:
  - {test: rv32im-c-cadd-01, <<: *common_test_config, asm_tests: <path_var>/riscv-arch-test/riscv-test-suite/rv32i_m/C/src/cadd-01.S}
  - {test: rv32im-c-caddi-01, <<: *common_test_config, asm_tests: <path_var>/riscv-arch-test/riscv-test-suite/rv32i_m/C/src/caddi-01.S}
  - {test: rv32im-c-cand-01, <<: *common_test_config, asm_tests: <path_var>/riscv-arch-test/riscv-test-suite/rv32i_m/C/src/cand-01.S}
  - {test: rv32im-c-candi-01, <<: *common_test_config, asm_tests: <path_var>/riscv-arch-test/riscv-test-suite/rv32i_m/C/src/candi-01.S}
  - {test: rv32im-c-cli-01, <<: *common_test_config, asm_tests: <path_var>/riscv-arch-test/riscv-test-suite/rv32i_m/C/src/cli-01.S}
  - {test: rv32im-c-cmv-01, <<: *common_test_config, asm_tests: <path_var>/riscv-arch-test/riscv-test-suite/rv32i_m/C/src/cmv-01.S}
  - {test: rv32im-c-cor-01, <<: *common_test_config, asm_tests: <path_var>/riscv-arch-test/riscv-test-suite/rv32i_m/C/src/cor-01.S}
  - {test: rv32im-c-csub-01, <<: *common_test_config, asm_tests: <path_var>/riscv-arch-test/riscv-test-suite/rv32i_m/C/src/csub-01.S}
  - {test: rv32im-c-cxor-01, <<: *common_test_config, asm_tests: <path_var>/riscv-arch-test/riscv-test-suite/rv32i_m/C/src/cxor-01.S}
