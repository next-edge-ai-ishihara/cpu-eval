common_test_config: &common_test_config
  path_var: TESTS_PATH
  gcc_opts: "-DXLEN=32 -DTEST_CASE_1=True -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<path_var>/riscv-arch-test/riscv-test-suite/env/ -I<path_var>/riscv-arch-test/riscv-target/spike/"

testlist:
  - test: csr-regfile-sequence
    <<: *common_test_config
    iterations: 1
    asm_tests: <path_var>/cpu-eval-patches/csr_regfile_sequence.S

  - test: csr-regfile-illegal
    path_var: TESTS_PATH
    gcc_opts: "-DXLEN=32 -DTEST_CASE_1=True -Drvtest_mtrap_routine=True -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<path_var>/riscv-arch-test/riscv-test-suite/env/ -I<path_var>/riscv-arch-test/riscv-target/spike/"
    iterations: 1
    asm_tests: <path_var>/cpu-eval-patches/csr_regfile_illegal.S

  - test: csr-regfile-ecall
    path_var: TESTS_PATH
    gcc_opts: "-DXLEN=32 -DTEST_CASE_1=True -Drvtest_mtrap_routine=True -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<path_var>/riscv-arch-test/riscv-test-suite/env/ -I<path_var>/riscv-arch-test/riscv-target/spike/"
    iterations: 1
    asm_tests: <path_var>/cpu-eval-patches/csr_regfile_ecall.S

  - test: csr-regfile-wfi
    <<: *common_test_config
    iterations: 1
    asm_tests: <path_var>/cpu-eval-patches/csr_regfile_wfi.S
